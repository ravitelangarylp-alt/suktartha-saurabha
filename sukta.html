<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಮಂತ್ರ ವಿವರಣೆ - ಸೂಕ್ತಿ ಸೌರಭ</title>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700&family=Noto+Sans+Kannada:wght@400;600;700&family=Noto+Serif+Devanagari:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="navbar-brand">Team Trayee</a>
        <div class="nav-links">
            <a href="index.html">ಮುಖಪುಟ</a>
            <a href="#">ಸೂಕ್ತಿ ಸೌರಭ</a>
        </div>
    </nav>

    <div class="container">
        <!-- ಹಿಂದಕ್ಕೆ ಹೋಗುವ ಬಟನ್ -->
        <a href="chapters.html" class="back-btn">← ಹಿಂದಿನ ಪುಟಕ್ಕೆ</a>
        
        <header class="mantra-header">
            <h1 id="sukta-title">ಲೋಡ್ ಆಗುತ್ತಿದೆ...</h1>
            <p id="anuvaka-title"></p>
            <p id="mantra-desc"></p>
        </header>

        <section class="mantra-display">
            <!-- ಮಂತ್ರ ನೇರವಾಗಿ ಕಾಣುತ್ತದೆ -->
            <div id="sanskrit-mantra" class="mantra-text"></div>
        </section>

        <section class="mantra-details">
            <!-- ಭಾವಾನುವಾದ (ಯಾವಾಗಲೂ ತೆರೆದಿರುತ್ತದೆ) -->
            <div class="bhavanuvada-box">
                <h3>ಭಾವಾನುವಾದ</h3>
                <p id="bhavanuvada-text"></p>
            </div>

            <!-- ಅಕಾರ್ಡಿಯನ್ (ಕ್ಲಿಕ್ ಮಾಡಿದಾಗ ತೆರೆಯುವ ಬಾಕ್ಸ್‌ಗಳು) -->
            <button class="accordion">ಶಬ್ದಶಃ ಅರ್ಥ</button>
            <div class="panel">
                <table id="shabdartha-table">
                    <tbody id="shabdartha-body"></tbody>
                </table>
            </div>

            <button class="accordion">ವ್ಯಾಕರಣ ವಿಶೇಷ</button>
            <div class="panel">
                <ul id="vyakarana-list"></ul>
            </div>

            <button class="accordion">ಭಾಷ್ಯಗಳು</button>
            <div class="panel">
                <p id="bhashya-text">ಭಾಷ್ಯಗಳ ಮಾಹಿತಿ ಸದ್ಯಕ್ಕೆ ಲಭ್ಯವಿಲ್ಲ.</p>
            </div>
        </section>
    </div>

    <footer>&copy; 2026 Team Trayee. ಸರ್ವ ಹಕ್ಕುಗಳನ್ನು ಕಾಯ್ದಿರಿಸಲಾಗಿದೆ.</footer>
